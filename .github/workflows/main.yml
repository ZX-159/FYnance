name: Release 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.8.1)'
        required: true
        default: '1.2.1'
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version (package.json + lockfile stay in sync)
        run: |
          node -e "
          const fs=require('fs');
          const v='${{ inputs.version }}';
          for (const f of ['package.json','package-lock.json']) {
            try { const p=JSON.parse(fs.readFileSync(f)); p.version=v; fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n'); }
            catch(e){ console.log('skip', f, e.message); }
          }
          "

      - name: Commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "v${{ inputs.version }}" || echo "nothing to commit"
          git push
          git tag "v${{ inputs.version }}" || true
          git push origin "v${{ inputs.version }}" || true

  build:
    needs: bump-and-release
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder libfuse2
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true

      - name: Install deps
        run: npm install

      - name: Build renderer + Python binary
        run: npm run build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish always

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npx electron-builder --linux AppImage --publish always
          if command -v flatpak >/dev/null 2>&1; then
            npx electron-builder --linux flatpak --publish always || echo "flatpak build failed (skipped)"
          else
            echo "flatpak not available — skipping flatpak target"
          fi
          if command -v rpmbuild >/dev/null 2>&1 || command -v rpm >/dev/null 2>&1; then
            npx electron-builder --linux rpm --publish always || echo "rpm build failed (skipped)"
          else
            echo "rpm not available — skipping rpm target"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.rpm
            release/*.flatpak
            release/latest*.yml
          if-no-files-found: ignore
